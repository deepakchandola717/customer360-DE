# Local infrastructure for the Customer360 assignment. This is not production configuration.
# Services provisioned:
#   postgres  -> operational CRM/order/payment source database (PostgreSQL 16)
#   clickhouse -> initially empty analytical warehouse (ClickHouse 25.8)
#
# You can set up equivalent databases without Docker. See docs/SETUP.md for
# database names, ports, versions and source-schema requirements.
#
# Running "docker compose up -d" does NOT import the fixtures or Kaggle events
# into ClickHouse. PostgreSQL's empty source tables are created on first launch.
# Run ./scripts/seed_postgres.sh separately to seed PostgreSQL from fixtures/.

name: customer360-assessment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdp_source}
      POSTGRES_USER: ${POSTGRES_USER:-cdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdp_local_only}
    ports:
      # Left side: host port; right side: PostgreSQL container port.
      # Bind only to localhost; credentials below are only for local assessment use.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Data survives "docker compose down" unless you also use "-v".
      - postgres_data:/var/lib/postgresql/data
      # Runs ONCE when a new PostgreSQL data volume is initialised.
      # Creates source tables but does not add any source rows.
      - ./docker/postgres/init/01_source_schema.sql:/docker-entrypoint-initdb.d/01_source_schema.sql:ro
      # Seed/reset script executed only when explicitly requested.
      - ./docker/postgres/seed_source_data.sql:/setup/seed_source_data.sql:ro
      # Generated CRM/order/payment fixtures (read-only in container).
      - ./fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-customer360}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cdp}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cdp_local_only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP API
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native TCP clients
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
